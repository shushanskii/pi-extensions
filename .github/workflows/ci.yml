# Every push to `main` and every pull request is checked the way `npm run check` checks it:
# types, then Biome (format, lint, import order), then fallow (package boundaries, then dead
# code). One step per tool, so a failed run names the tool instead of ending in "check
# failed"; the steps call the same npm scripts the local gate calls, so the two cannot drift
# apart.
#
# `report` is advisory and cannot fail: it prints duplication and complexity, which this
# repository currently keeps on purpose (one file per extension repeats its registration
# boilerplate). Make a step of them fail only after that code is restructured.
#
# Both tools are native binaries picked per platform, and the runner's CPU decides which ones
# survive. On the runner this repository built on before GitHub, fallow's musl build died a
# second into the analysis with `fallow binary terminated by signal SIGILL` (exit 132) while
# the same version worked on macOS. `what this container is` found the reason there:
# /proc/cpuinfo reported `sse4_2` and no AVX at all, so the rule is not "musl is broken" but
# "that CPU has no AVX2, and fallow's musl build takes an AVX2 path anyway" — the glibc build
# of the same version ran on the same machine. Hence a Debian base, where fallow picks
# @fallow-cli/linux-x64-gnu.
#
# The first run on GitHub measured that constraint away: the runner's /proc/cpuinfo carries
# `avx2` and avx512 through `avx512vbmi`, and fallow 3.37.0 verified its linux-x64-gnu sentinel
# there. The base is therefore no longer a workaround for this runner's CPU but the reason the
# job picks a build already known good. The step that found the original reason stays: it is
# the only thing that ever explained a signal no local run could reproduce, and it costs one
# line.
#
# A tag NAME@VERSION (pi-web@1.2.0) publishes packages/NAME to GitHub Packages — once, after
# the check, and only when VERSION is what that package.json says, so a tag cannot publish a
# version the manifest does not carry.
#
# Publishing needs no secret of its own. GITHUB_TOKEN may publish packages belonging to the
# repository the workflow runs in, and a package whose `repository` field names this
# repository inherits its permissions, which is what grants that token the write. Two
# constraints of this registry are the reason each package manifest says what it says: the
# scope has to name the account that owns the repository, because the registry routes a
# package by its scope, and it accepts GITHUB_TOKEN or a personal access token (classic) and
# not a fine-grained token, so a machine that installs these packages needs a classic token
# with read:packages in its ~/.npmrc.
name: ci
on:
  push:
    branches: [main]
    tags: ["*@*"]
  # A gate that first runs after the merge is a gate that reports problems into main.
  # main is protected and only changes through a pull request, so this trigger is what lets
  # the check be proved before it lands — which is how the fallow-in-alpine failure below was
  # caught at all.
  pull_request:
  # A run on demand, on any ref, without opening a pull request: the gate can be re-proved by
  # `gh workflow run ci.yml --ref <ref>`, which is how a change to the gate itself gets tested
  # before anything merges.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    container: { image: node:22 }
    steps:
      - uses: actions/checkout@v4
      - run: npm ci --no-audit --no-fund
      # Reports, never fails: every line ends in `|| true`. A native binary dying by signal is
      # only diagnosable with these facts, and `--version` here separates "crashes on startup"
      # from "crashes once it starts reading the repository".
      - name: what this container is
        run: |
          uname -a || true
          grep -m1 PRETTY_NAME /etc/os-release || true
          node -v; npm -v
          grep -m1 '^flags' /proc/cpuinfo | tr ' ' '\n' | grep -E '^(avx|avx2|avx512[a-z0-9]*|sse4_2|bmi[0-9])$' | tr '\n' ' ' || true
          echo
          npx fallow --version || true
      - name: types
        run: npm run typecheck
      - name: format and lint
        run: npm run lint
      # RUST_BACKTRACE because a Rust abort() loses fallow's buffered stdout — the backtrace
      # goes to stderr, which is unbuffered, so it is the only trace that survives.
      - name: boundaries and dead code
        env: { RUST_BACKTRACE: "1" }
        run: npm run analyze
      - name: duplication and complexity (advisory)
        run: npm run report

  publish:
    needs: check
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # Alpine here is fine: this job only runs npm publish, and no native binary is involved.
    container: { image: node:22-alpine }
    steps:
      - uses: actions/checkout@v4
      - name: publish the package the tag names
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          name="${TAG%@*}"; version="${TAG##*@}"
          dir="packages/$name"
          [ -f "$dir/package.json" ] || { echo "tag $TAG names no package: $dir/package.json is missing"; exit 1; }
          declared=$(node -p "require('./$dir/package.json').version")
          [ "$declared" = "$version" ] || { echo "tag says $version, $dir/package.json says $declared"; exit 1; }
          # Checked here so a scope that cannot be published from this repository fails with
          # this line rather than with an authentication error from the registry.
          scope=$(node -p "require('./$dir/package.json').name.split('/')[0]")
          [ "$scope" = "@shushanskii" ] || { echo "tag $TAG names $scope; this repository can only publish under @shushanskii"; exit 1; }
          printf '@shushanskii:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=%s\n' "$GITHUB_TOKEN" > "$HOME/.npmrc"
          npm publish "./$dir"
